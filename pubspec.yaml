name: royalgambit
description: "Royal Gambit — A fully-featured cross-platform chess game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0
  flutter_svg: ^2.0.17
  google_mobile_ads: ^5.2.0
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/ic_chess.png"
  min_sdk_android: 21
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/images/ic_chess.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/board/
    - assets/board-thumbnails/
    - assets/pieces/
    - assets/pieces/alpha/
    - assets/pieces/totoy/
    - assets/pieces/fantasy/
    - assets/images/
    - assets/images/stockfish/
    - assets/sounds/standard/
